# =============================================================
# SIGEP-CACCO · Ambiente de pruebas con Docker Compose
# Servicios: PostgreSQL 16, backend Laravel (php-fpm + nginx)
# y frontend Vue servido por nginx (que además hace proxy /api).
#
# Uso:  docker compose up -d --build
#       docker compose exec backend php artisan migrate --seed
# App:  http://localhost:8080
# =============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: sigep-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sigep_cacco}
      POSTGRES_USER: ${DB_USERNAME:-sigep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - sigep-db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-sigep} -d ${DB_DATABASE:-sigep_cacco}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: sigep-backend
    environment:
      APP_NAME: SIGEP-CACCO
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Defina APP_KEY en .env (php artisan key:generate --show)}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: es
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sigep_cacco}
      DB_USERNAME: ${DB_USERNAME:-sigep}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SANCTUM_TOKEN_EXPIRATION: ${SANCTUM_TOKEN_EXPIRATION:-480}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - sigep-storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: sigep-frontend
    ports:
      - '${APP_PUERTO:-8080}:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sigep-db-datos:
  sigep-storage:
