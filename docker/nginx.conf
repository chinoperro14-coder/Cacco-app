# nginx del frontend: sirve la SPA y enruta la API al backend php-fpm.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m; # subida de PDF hasta 20 MB + margen

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Laravel vía php-fpm del contenedor backend
    location /api {
        try_files $uri @laravel;
    }
    location /up {
        try_files $uri @laravel;
    }
    location @laravel {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $uri;
    }
}
